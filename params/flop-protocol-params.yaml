  # ---- Consensus / finality committee ----
  - name: babe_primary_probability_denominator
    mutability: runtime-upgrade-only
    on_chain: {source_only: Not exported as a FRAME constant; verified against source only.}
    value: 50
    unit: ratio-denominator
    rust: PRIMARY_PROBABILITY
    description: >
      BABE primary-slot probability c = 1/N, where a validator's per-slot win chance is
      p = 1 - (1 - c)^theta (theta = stake fraction). This is the fork-rate dial: AllowedSlots is
      PrimaryAndSecondaryVRFSlots, which already guarantees exactly one secondary author per slot,
      so every primary winner is an ADDITIONAL author — i.e. a fork. At the previous 1/4 with 5
      equal-stake authorities ~20% of slots forked (~12/min at 1 s blocks; devnet measured 4.7
      reorgs/min/node), which was the common root of the 2026-07-25 stalls: deep reorgs, finality
      landing off a node's best branch, block-request churn, reputation bans, validator isolation.
      1/50 gives ~1.6% — a ~12x reduction. Costs nothing in randomness: pallet_babe deposits epoch
      randomness from any VRF-carrying pre-digest and SecondaryVRFSlots blocks carry one, so the
      beacon seeding the PoUI committee sampler is fed by every block regardless of c.
    implementations:
      - { file: pallets/runtime/zkverify/src/lib.rs, expect: "PRIMARY_PROBABILITY: (u64, u64) = (1, 50)" }
      # The relay-node test runtime carries its own copy (vendored from Polkadot, whose 1/4 is
      # derived for 6 s slots). Enforced here so tests cannot silently drift back to a fork rate
      # production no longer has.
      - {
          file: pallets/relay-node/test/runtime/constants/src/lib.rs,
          expect: "PRIMARY_PROBABILITY: (u64, u64) = (1, 50)",
        }

