  - { name: validator_stake_value_coupled_floor, value: "dynamic", unit: FLOP, note: "D-0413 (C5): governance-retargeted value-coupled stake floor k·V_booked (storage ValueCoupledStakeFloor, default 0 = baseline-identical). Set via set_value_coupled_floor (root, slow cadence, capped at 1% issuance); enforced as effective_minimum_stake = max(MinimumValidatorStake, this). Site: pallets/pallets/validators/src/lib.rs. Coupling rate k ≥ m·κ/(θ·N·σ·δ): at the AlephBFT safety threshold θ=1/3 (NOT 51% — θ does NOT cancel here, unlike the reward-capture base) the floor is k ≥ ~1.2e-3 (Lean value_coupling_threshold_at_bft_safety); the earlier-blessed k=1e-3 is INSUFFICIENT at θ=1/3 (value_coupling_k1e3_insufficient_at_bft_safety). κ is the extractable-fraction ASSUMPTION — see security_kappa_extractable. Lean: Security.lean::CoCVoC.value_coupled_security / deterrence_at_bft_safety_value_coupled / deterrence_decomposed_kappa.", mutability: governance-settable, on_chain: {source_only: Governance storage has a per-model key or dynamic/optional value; no fixed scalar constant to diff.}, governance_setter: Validators.set_value_coupled_floor }
  - { name: security_kappa_extractable,  value: 0.2,        unit: dimensionless, note: "ASSUMPTION — NOT a theorem; a governance/DEC-5 risk input. κ = fraction of realized value V_booked a successful AlephBFT safety break extracts; the lever the value-coupled stake floor rests on (k ≥ m·κ/(θ·N·σ·δ), linear in κ — k_threshold_scales_with_kappa). DECOMPOSED (Lean Security.lean::CoCVoC.kappaTotal = κ_ds + κ_cc): κ_ds (double-spend / reversible-settlement) = settleRate·window/V is DERIVABLE and NEGLIGIBLE (~1e-3 at 1e6 FLOP/s, 10 s window, 1e10 valuation — kappaDoubleSpend_small_example), so this 0.2 is essentially κ_cc (confidence-collapse: value destroyed when safety visibly breaks), which is IRREDUCIBLY an assumption in [0,1] — no protocol theorem can derive it. A conservative κ_cc→1 needs ~5× the coupling rate. NOT drift-checked (no shipped constant); recorded here so the 0.2 is a LABELED, owned assumption rather than a hidden Lean constant. Lean: deterrence_decomposed_kappa, kappaDoubleSpend, kappaDoubleSpend_small_example.", mutability: source-only, on_chain: {source_only: 'Model, SDK, or documented value; no exported on-chain constant.'} }
