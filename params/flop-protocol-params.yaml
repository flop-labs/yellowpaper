    description: "D-0412 refundable anti-spam deposit for leased DA (model weights): deposit = bytes × DepositPerByte, held on the publisher (never validator revenue), returned in full on prune/withdrawal. Term-independent (top-ups free). Genesis default 200 FLOP/GB = 2e-7 FLOP/byte (DaDepositPerByte = 200·VFY/1e9, runtime/zkverify), calibrated as on-chain-state cost (0.001 FLOP/byte) × RS replication (2×) ÷ full-node count (~200) × prunability discount (~1/50). GOVERNABLE without a runtime upgrade via pallet_da_registry::set_deposit_per_byte (root). Effective value is materialized in storage DepositPerByteValue (getter deposit_per_byte), readable off-chain at api.query.daRegistry.depositPerByteValue — the api.consts.daRegistry.depositPerByte metadata entry reflects only this genesis default and does NOT track overrides. Site: pallets/pallets/da-registry/src/lib.rs. NOT a fee — DA is a validator duty funded by the validator reward share."
