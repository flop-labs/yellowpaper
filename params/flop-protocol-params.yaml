  # ---- Metering cert tokens-per-byte band (#871) ----
  # Wired into the model-registry field + compute-channel settle path (#891); the runtime sites
  # are now enforced by this checker alongside the SPEC + Lean/KAT anchors.
  - name: tokens_per_byte_band_ppm_llama3
    mutability: governance-settable
    on_chain: {source_only: Governance storage has a per-model key or dynamic/optional value; no fixed scalar constant to diff.}
    governance_setter: ModelRegistry.set_tokens_per_byte_band_ppm
    value: 500000
    unit: ppm
    lean: MeteringCertInt.tokensPerByteBandPpmLlama3
    description: >
      Certified upper bound on honest tokens-per-byte for the Llama-3 tokenizer (ppm; 500000 =
      0.5 tokens/byte) — the per-(model, tokenizer) model-registry field that caps the metering
      cert padding constraint (e): prompt_tokens ≤ ⌈len(input_bytes) · band/1e6⌉ and
      generated_tokens ≤ ⌈(len(output_bytes) + 1) · band/1e6⌉ (#871, spec
      whitepaper/research/metering-cert-spec.md §4). The output framing byte is outside the
      committed plaintext and adds at most one token slot for 0 < band ≤ 1e6, even without EOS;
      tightening the band does not authenticate that slot. Byte-level BPE has a 1.0 tokens/byte
      (1e6 ppm) ceiling; lower bands require calibration to avoid honest rejections.
      Illustrative default — production thresholds are governance-set from the calibration
      harness, exactly like toploc_band_* (#705).
    implementations:
      - { file: lean-proofs/FlopSpecs/Computable.lean, expect: "def tokensPerByteBandPpmLlama3 : Nat := 500000" }
      - { file: whitepaper/research/metering-cert-spec.md, expect: "tokens_per_byte_band_ppm_llama3" }
